<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign up — Whetstone</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&amp;display=swap">
<style>
body{margin:0;background:#0b0c0d}
a{color:#b7babd}a:hover{color:#d9d5cd}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #d9d5cd;outline-offset:2px}
input::placeholder{color:#86847f}
input:hover{border-color:#b7babd}
.ws-primary{transition:background 160ms cubic-bezier(0.2,0,0,1)}
.ws-primary:hover{background:#8e2118}
.ws-primary:active{box-shadow:inset 0 2px 0 0 rgba(0,0,0,0.45)}
@media (max-width:640px){
.ws-name{font-size:40px !important;line-height:44px !important}
.ws-pad{padding:16px !important}
}
</style>
</helmet>
<div style="position: relative; min-height: 100vh; box-sizing: border-box; padding: 64px 16px; display: flex; align-items: center; justify-content: center; background: #0b0c0d; color: #d9d5cd; font-family: 'Source Serif 4', 'Iowan Old Style', Georgia, serif; overflow: hidden">
<svg aria-hidden="true" width="0" height="0" style="position: absolute"><filter id="ws-grain-b"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter></svg>
<svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.06; pointer-events: none"><rect width="100%" height="100%" filter="url(#ws-grain-b)"></rect></svg>
<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.6) 100%)"></div>

<main style="position: relative; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 32px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
<h1 class="ws-name" style="margin: 0; font-family: 'Libre Caslon Condensed', 'Iowan Old Style', Georgia, serif; font-weight: 700; font-size: 56px; line-height: 60px; letter-spacing: 0.18em; text-transform: uppercase; color: #d9d5cd; padding-left: 0.18em">Whetstone</h1>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; width: 200px">
<span style="flex: 1; height: 1px; background: #676b70"></span>
<span style="width: 7px; height: 7px; border: 1px solid #8d9196; transform: rotate(45deg)"></span>
<span style="flex: 1; height: 1px; background: #676b70"></span>
</div>
<p style="margin: 0; font-style: italic; font-size: 20px; line-height: 30px; color: #d9d5cd">A System has been assigned to you.</p>
<p style="margin: 0; max-width: 36ch; font-size: 14px; line-height: 21px; color: #a19e98">Each day's deeds are written down and weighed. Body, Mind and Will rise only by what is recorded.</p>
</div>

<form class="ws-pad" style="position: relative; width: 100%; box-sizing: border-box; background: #131416; border: 1px solid #2f3034; padding: 24px; display: flex; flex-direction: column; gap: 20px; clip-path: polygon(5px 0, calc(100% - 7px) 0, 100% 6px, 100% calc(100% - 5px), calc(100% - 7px) 100%, 5px 100%, 0 calc(100% - 7px), 0 4px)">
<svg aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0.06; pointer-events: none"><rect width="100%" height="100%" filter="url(#ws-grain-b)"></rect></svg>
<div style="position: relative; display: flex; flex-direction: column; gap: 8px">
<label for="email-u" style="font-family: 'Libre Caslon Condensed', 'Iowan Old Style', Georgia, serif; font-weight: 600; font-size: 14px; line-height: 16px; letter-spacing: 0.14em; text-transform: uppercase; color: #b7babd">Email</label>
<input id="email-u" name="email" type="email" autocomplete="email" style="box-sizing: border-box; width: 100%; height: 48px; margin: 0; padding: 0 16px; background: #1b1c1f; border: 1px solid #676b70; border-radius: 1px; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.6); font-family: 'Source Serif 4', 'Iowan Old Style', Georgia, serif; font-size: 16px; color: #d9d5cd">
</div>
<div style="position: relative; display: flex; flex-direction: column; gap: 8px">
<label for="password-u" style="font-family: 'Libre Caslon Condensed', 'Iowan Old Style', Georgia, serif; font-weight: 600; font-size: 14px; line-height: 16px; letter-spacing: 0.14em; text-transform: uppercase; color: #b7babd">Password</label>
<input id="password-u" name="password" type="password" autocomplete="new-password" style="box-sizing: border-box; width: 100%; height: 48px; margin: 0; padding: 0 16px; background: #1b1c1f; border: 1px solid #676b70; border-radius: 1px; box-shadow: inset 0 2px 4px 0 rgba(0,0,0,0.6); font-family: 'Source Serif 4', 'Iowan Old Style', Georgia, serif; font-size: 16px; color: #d9d5cd">
</div>
<button type="submit" class="ws-primary" style="position: relative; margin-top: 4px; height: 48px; background: #7a1a14; border: 0; cursor: pointer; font-family: 'Libre Caslon Condensed', 'Iowan Old Style', Georgia, serif; font-weight: 600; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; color: #d9d5cd; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px)">Sign up</button>
</form>

<p style="margin: 0; font-size: 14px; line-height: 21px; color: #a19e98">Already recorded? <a href="SignIn.dc.html" style="display: inline-block; padding: 12px 4px; font-family: 'Libre Caslon Condensed', 'Iowan Old Style', Georgia, serif; font-weight: 600; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase">Sign in</a></p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
